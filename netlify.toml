[build]
  command = "pnpm build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = false

# Scheduled builds for blog post publishing
# Rebuilds the site daily at 00:00 UTC to publish scheduled posts
[[scheduled_functions]]
  name = "publish-scheduled-posts"
  schedule = "0 0 * * *"