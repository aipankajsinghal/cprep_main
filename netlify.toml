[build]
  command = "pnpm build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = false

# Scheduled builds for blog post publishing
# Rebuilds the site daily at 00:00 UTC to publish scheduled posts
[[scheduled_functions]]
  name = "publish-scheduled-posts"
  schedule = "0 0 * * *"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache fonts for 1 year (immutable – hashed filenames)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache icons for 1 year
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache vendor scripts for 1 year
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache OG images for 1 day (regenerated on each build)
[[headers]]
  for = "/blog/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"